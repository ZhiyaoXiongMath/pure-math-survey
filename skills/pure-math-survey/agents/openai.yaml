interface:
  display_name: "Pure Math Survey"
  short_description: "Compact, source-checked mathematical surveys"
  default_prompt: "Use $pure-math-survey. Identify the organizing problem, check current primary sources, state actual main conclusions early, and deliver a compact rebuildable TeX/PDF survey. Default to Part V concise; an explicitly requested suite uses I–V concise. Preserve core statements and key lemmas in the body, with explicit proof or sourced-outline boundaries. Concise compresses proof interiors; standard develops the same mathematical spine. Perform statement-only and dependency readings. Preserve all necessary hypotheses and mark fresh preprint claims. Follow the length review limits, generic templates and Part V guide; sample use is optional and purpose-specific."
